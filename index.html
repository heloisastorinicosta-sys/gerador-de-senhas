<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="conteudo">

        <div class="conteudo-titulo">
            <img src="unlock.svg" alt="cadeado">
            <h2 class="titulo-principal">Gerador de Senhas</h2>
            <h3 class="titulo-secundario">
                Gere instantaneamente uma senha aleatória e segura
            </h3>
        </div>

        <div class="conteudo-senha">
            <label for="campo-senha">Senha</label>
            <input type="text" id="campo-senha" readonly>
            <button id="gerar">Gerar Senha</button>
        </div>

        <div class="parametro">
            <h3 class="parametro-titulo">Personalize sua senha</h3>

            <div class="parametro-senha">
                <h4>Número de caracteres</h4>

                <input type="range" id="tamanho" min="4" max="32" value="12">

                <span id="valor-tamanho">12</span>
            </div>

            <div class="parametro-senha">
                <h4>Características da senha</h4>

                <label>
                    <input type="checkbox" id="maiusculas" checked>
                    Letras Maiúsculas
                </label>

                <label>
                    <input type="checkbox" id="minusculas" checked>
                    Letras Minúsculas
                </label>

                <label>
                    <input type="checkbox" id="numeros" checked>
                    Números
                </label>

                <label>
                    <input type="checkbox" id="simbolos">
                    Símbolos
                </label>
            </div>

            <div class="parametro-senha">
                <h4>Força da senha</h4>

                <div class="barra">
                    <div id="forca"></div>
                </div>

                <p id="texto-forca">Média</p>
            </div>

        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
