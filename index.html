<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas Seguras</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="header">
            <img src="unlock.svg" alt="Ícone de cadeado" class="icone">
            <h1>Gerador de Senhas</h1>
            <p>Crie senhas fortes e seguras em segundos.</p>
        </div>

        <div class="senha-box">
            <label for="campo-senha">Senha Gerada</label>

            <div class="senha-container">
                <input type="text" id="campo-senha" readonly>
                <button id="copiar">Copiar</button>
            </div>

            <button id="gerar" class="btn-gerar">
                Gerar Nova Senha
            </button>
        </div>

        <div class="configuracoes">

            <h2>Personalização</h2>

            <div class="campo">
                <label for="tamanho">
                    Tamanho da senha:
                    <span id="valor-tamanho">12</span>
                </label>

                <input
                    type="range"
                    id="tamanho"
                    min="4"
                    max="32"
                    value="12">
            </div>

            <div class="campo">
                <h3>Tipos de caracteres</h3>

                <label>
                    <input type="checkbox" id="maiusculas" checked>
                    Letras maiúsculas
                </label>

                <label>
                    <input type="checkbox" id="minusculas" checked>
                    Letras minúsculas
                </label>

                <label>
                    <input type="checkbox" id="numeros" checked>
                    Números
                </label>

                <label>
                    <input type="checkbox" id="simbolos">
                    Símbolos
                </label>
            </div>

            <div class="campo">
                <h3>Força da senha</h3>

                <div class="barra">
                    <div id="forca"></div>
                </div>

                <p id="texto-forca">Média</p>
            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
